# Auto-bump base-image digest pins via monthly PRs once the repo is on GitHub.
# Covers the two live build paths (root image + agent); `make refresh-digests` is
# the offline/manual equivalent.
version: 2
updates:
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/agent"
    schedule:
      interval: "monthly"
    # Keep runtime-line upgrades deliberate; continue accepting in-line image
    # refreshes and Dependabot security updates.
    ignore:
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "python"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
