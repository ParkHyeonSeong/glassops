[supervisord]
nodaemon=true
silent=true
logfile=/app/data/logs/supervisor.log
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0770
chown=root:appuser

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:backend]
command=uvicorn app.main:app --host 127.0.0.1 --port 8000
directory=/app
user=appuser
environment=HOME="/tmp",USER="appuser"
priority=10
autostart=true
autorestart=true
stdout_logfile=/app/data/logs/backend.log
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=python -m app.nginx_config run
directory=/app
priority=20
autostart=true
autorestart=true
stdout_logfile=/app/data/logs/nginx-startup.log
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:agent]
command=python -m agent.main
directory=/app
priority=30
startsecs=3
autostart=true
autorestart=true
stdout_logfile=/app/data/logs/agent.log
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=GLASSOPS_SERVER_URL="ws://127.0.0.1:8000/ws/agent",GLASSOPS_AGENT_KEY="%(ENV_GLASSOPS_AGENT_KEY)s"
